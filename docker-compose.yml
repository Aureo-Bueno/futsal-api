services:
  postgres:
    image: postgres:17
    container_name: futsal-postgres
    environment:
      POSTGRES_DB: bff_db
      POSTGRES_USER: futsal
      POSTGRES_PASSWORD: futsal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futsal -d bff_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3
    container_name: futsal-localstack
    environment:
      SERVICES: sns,sqs
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack/init.sh:/etc/localstack/init/ready.d/init.sh:ro
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: futsal_event_sourcing_postgres_data
  localstack_data:
    name: futsal_event_sourcing_localstack_data
