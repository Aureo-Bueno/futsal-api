services:
  postgres:
    image: postgres:17
    container_name: futsal-postgres
    environment:
      POSTGRES_DB: bff_db
      POSTGRES_USER: futsal
      POSTGRES_PASSWORD: futsal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futsal -d bff_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3
    container_name: futsal-localstack
    environment:
      SERVICES: sns,sqs
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack/init.sh:/etc/localstack/init/ready.d/init.sh:ro
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  team-service:
    build:
      context: .
      dockerfile: team-service/Dockerfile
    container_name: futsal-team-service
    environment:
      APP_ENV: local
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: team_db
      DB_USERNAME: futsal
      DB_PASSWORD: futsal
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      TEAM_EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:futsal-team-events
      INTERNAL_HMAC_SECRET: local-secret
    ports:
      - "8001:8001"
    volumes:
      - ./team-service:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  team-worker:
    build:
      context: .
      dockerfile: team-service/Dockerfile
    container_name: futsal-team-worker
    entrypoint: ["/usr/local/bin/worker.sh"]
    environment:
      APP_ENV: local
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: team_db
      DB_USERNAME: futsal
      DB_PASSWORD: futsal
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      TEAM_EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:futsal-team-events
      INTERNAL_HMAC_SECRET: local-secret
    volumes:
      - ./team-service:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  match-service:
    build:
      context: .
      dockerfile: match-service/Dockerfile
    container_name: futsal-match-service
    environment:
      APP_ENV: local
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: match_db
      DB_USERNAME: futsal
      DB_PASSWORD: futsal
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      MATCH_EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:futsal-match-events.fifo
      TEAM_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/match-team-events
      INTERNAL_HMAC_SECRET: local-secret
    ports:
      - "8002:8002"
    volumes:
      - ./match-service:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  match-worker:
    build:
      context: .
      dockerfile: match-service/Dockerfile
    container_name: futsal-match-worker
    entrypoint: ["/usr/local/bin/worker.sh"]
    environment:
      APP_ENV: local
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: match_db
      DB_USERNAME: futsal
      DB_PASSWORD: futsal
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      MATCH_EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:futsal-match-events.fifo
      TEAM_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/match-team-events
      INTERNAL_HMAC_SECRET: local-secret
    volumes:
      - ./match-service:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  standings-service:
    build:
      context: .
      dockerfile: standings-service/Dockerfile
    container_name: futsal-standings-service
    environment:
      APP_ENV: local
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: standings_db
      DB_USERNAME: futsal
      DB_PASSWORD: futsal
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      STANDINGS_QUEUE_URL: http://localstack:4566/000000000000/standings-match-events.fifo
      INTERNAL_HMAC_SECRET: local-secret
    ports:
      - "8003:8003"
    volumes:
      - ./standings-service:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  standings-worker:
    build:
      context: .
      dockerfile: standings-service/Dockerfile
    container_name: futsal-standings-worker
    entrypoint: ["/usr/local/bin/worker.sh"]
    environment:
      APP_ENV: local
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: standings_db
      DB_USERNAME: futsal
      DB_PASSWORD: futsal
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      STANDINGS_QUEUE_URL: http://localstack:4566/000000000000/standings-match-events.fifo
      INTERNAL_HMAC_SECRET: local-secret
    volumes:
      - ./standings-service:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  bff:
    build:
      context: .
      dockerfile: bff/Dockerfile
    container_name: futsal-bff
    environment:
      APP_ENV: local
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: bff_db
      DB_USERNAME: futsal
      DB_PASSWORD: futsal
      TEAM_SERVICE_URL: http://team-service:8001
      MATCH_SERVICE_URL: http://match-service:8002
      STANDINGS_SERVICE_URL: http://standings-service:8003
      INTERNAL_HMAC_SECRET: local-secret
      RUN_SEED: "true"
    ports:
      - "8000:80"
    volumes:
      - ./bff:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      team-service:
        condition: service_started
      match-service:
        condition: service_started
      standings-service:
        condition: service_started

volumes:
  postgres_data:
    name: futsal_event_sourcing_postgres_data
  localstack_data:
    name: futsal_event_sourcing_localstack_data
